<!DOCTYPE html>
<html>
<body>
<script>
async function test() {
    try {
        const response = await fetch("https://script.google.com/macros/s/AKfycbz8FX1qyTUnQKP0MZ3mEH5uU_tmqBSIRdlyeqRxhhR_SBPOn6io6ROg64gWtvkVMAvz/exec", {
            method: "POST",
            body: JSON.stringify({ action: "upload_data", data: [["TEST", "OK"]] })
        });
        const result = await response.text();
        console.log("Success:", result);
    } catch(e) {
        console.error("Error:", e);
    }
}
test();
</script>
</body>
</html>
